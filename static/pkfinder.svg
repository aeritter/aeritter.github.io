<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 620 450"
     width="100%" height="100%">

  <!-- definition block -->
  <defs>
    <style>
      .bg          { fill:none; }               /* transparent canvas */
      .cell        { fill:#ffffff; stroke:#94a3b8; stroke-width:1.5;
                     transition:fill .3s ease-in-out; will-change:fill; }
      .header      { fill:#1e293b; rx:2; }
      .text-cell   { font-family:system-ui,-apple-system,sans-serif;
                     font-size:16px; fill:#334155;
                     text-anchor:middle; dominant-baseline:central; }
      .header-text { font-family:system-ui,-apple-system,sans-serif;
                     font-size:18px; font-weight:600; fill:#ffffff;
                     text-anchor:middle; dominant-baseline:central; }
      .magnifier   { transition:transform .5s cubic-bezier(.25,1,.5,1);
                     will-change:transform;
                     filter:drop-shadow(0 4px 8px rgba(0,0,0,.2)); }

      .c2-indicator {
        fill:none;
        stroke:#ffeb3b;          /* yellow */
        stroke-width:4;
        opacity:0;
        transition:opacity .3s;
      }
    </style>
  </defs>

  <!-- transparent background (optional) -->
  <rect class="bg" width="100%" height="100%"/>

  <!-- Center the whole table inside the 620×450 viewBox -->
  <g id="scene" transform="translate(-20,15)">

    <!-- Table (header + rows) -->
    <g id="table" shape-rendering="crispEdges">
      <rect x="50"  y="60" width="140" height="50" class="header"/>
      <text x="120" y="85" class="header-text">c1</text>
      <rect x="190" y="60" width="140" height="50" class="header"/>
      <text x="260" y="85" class="header-text">c2</text>
      <rect x="330" y="60" width="140" height="50" class="header"/>
      <text x="400" y="85" class="header-text">c3</text>
      <rect x="470" y="60" width="140" height="50" class="header"/>
      <text x="540" y="85" class="header-text">c4</text>

      <rect id="r1c1" x="50"  y="110" width="140" height="50" class="cell"/>
      <text x="120" y="135" class="text-cell">1</text>
      <rect id="r1c2" x="190" y="110" width="140" height="50" class="cell"/>
      <text x="260" y="135" class="text-cell">A</text>
      <rect id="r1c3" x="330" y="110" width="140" height="50" class="cell"/>
      <text x="400" y="135" class="text-cell">X</text>
      <rect id="r1c4" x="470" y="110" width="140" height="50" class="cell"/>
      <text x="540" y="135" class="text-cell">10</text>

      <rect id="r2c1" x="50"  y="160" width="140" height="50" class="cell"/>
      <text x="120" y="185" class="text-cell">1</text>
      <rect id="r2c2" x="190" y="160" width="140" height="50" class="cell"/>
      <text x="260" y="185" class="text-cell">B</text>
      <rect id="r2c3" x="330" y="160" width="140" height="50" class="cell"/>
      <text x="400" y="185" class="text-cell">Y</text>
      <rect id="r2c4" x="470" y="160" width="140" height="50" class="cell"/>
      <text x="540" y="185" class="text-cell">10</text>

      <rect id="r3c1" x="50"  y="210" width="140" height="50" class="cell"/>
      <text x="120" y="235" class="text-cell">2</text>
      <rect id="r3c2" x="190" y="210" width="140" height="50" class="cell"/>
      <text x="260" y="235" class="text-cell">C</text>
      <rect id="r3c3" x="330" y="210" width="140" height="50" class="cell"/>
      <text x="400" y="235" class="text-cell">X</text>
      <rect id="r3c4" x="470" y="210" width="140" height="50" class="cell"/>
      <text x="540" y="235" class="text-cell">10</text>

      <rect id="r4c1" x="50"  y="260" width="140" height="50" class="cell"/>
      <text x="120" y="285" class="text-cell">3</text>
      <rect id="r4c2" x="190" y="260" width="140" height="50" class="cell"/>
      <text x="260" y="285" class="text-cell">D</text>
      <rect id="r4c3" x="330" y="260" width="140" height="50" class="cell"/>
      <text x="400" y="285" class="text-cell">Y</text>
      <rect id="r4c4" x="470" y="260" width="140" height="50" class="cell"/>
      <text x="540" y="285" class="text-cell">10</text>

      <rect id="r5c1" x="50"  y="310" width="140" height="50" class="cell"/>
      <text x="120" y="335" class="text-cell">4</text>
      <rect id="r5c2" x="190" y="310" width="140" height="50" class="cell"/>
      <text x="260" y="335" class="text-cell">E</text>
      <rect id="r5c3" x="330" y="310" width="140" height="50" class="cell"/>
      <text x="400" y="335" class="text-cell">X</text>
      <rect id="r5c4" x="470" y="310" width="140" height="50" class="cell"/>
      <text x="540" y="335" class="text-cell">20</text>
    </g>

    <!-- Yellow box that highlights column 2 (static) -->
    <rect id="c2-indicator"
          x="190" y="60"
          width="140" height="300"
          class="c2-indicator"/>

    <!-- Magnifier (positioned by script) -->
    <g class="magnifier">
      <circle cx="0" cy="0" r="26"
              fill="rgba(255,255,255,0.45)" stroke="#37474f" stroke-width="3"/>
      <line   x1="18" y1="18" x2="38" y2="38"
              stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <script type="text/javascript"><![CDATA[
    const mag       = document.querySelector('.magnifier');
    const indicator = document.getElementById('c2-indicator');

    const setPos   = (x, y) => mag.style.transform = `translate(${x}px,${y}px)`;
    const setColor = (id, colour) => {
      const el = document.getElementById(id);
      if (el) el.style.fill = colour;
    };
    const resetAll = () => {
      const ids = [
        'r1c1','r2c1','r3c1','r4c1','r5c1',
        'r1c2','r2c2','r3c2','r4c2','r5c2'
      ];
      ids.forEach(id => setColor(id, '#ffffff'));
    };
    const delay    = ms => new Promise(res => setTimeout(res, ms));

    const showIndicator = () => { indicator.style.opacity = 1; };
    const hideIndicator = () => { indicator.style.opacity = 0; };

    async function runSequence() {
      // Scan column 1
      setPos(120, 85);
      await delay(500);

      setPos(120, 135);
      setColor('r1c1', '#22c55e');
      await delay(700);

      setPos(120, 185);
      setColor('r1c1', '#ef4444');
      setColor('r2c1', '#ef4444');
      await delay(1000);

      // Switch to column 2
      setPos(260, 85);
      resetAll();

      const pauseE = 1500;
      for (let i = 1; i <= 5; i++) {
        await delay(600);
        const y = 135 + (i - 1) * 50;
        setPos(260, y);
        setColor(`r${i}c2`, '#22c55e');

        if (i === 5) {
          showIndicator();
          await delay(pauseE);
          hideIndicator();
        }
      }

      // Return to start
      await delay(1000);
      resetAll();
      setPos(120, 85);
      await delay(500);

      // Loop forever
      runSequence();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runSequence);
    } else {
      runSequence();
    }
  ]]></script>
</svg>
